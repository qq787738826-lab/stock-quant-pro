server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: stock-quant-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_quant}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
quant:
  ai-service-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
  jobs:
    daily-scan-cron: "0 10 16 * * MON-FRI"
    portfolio-risk-cron: "0 30 16 * * MON-FRI"
  market:
    scan-default-limit: 0
    scan-batch-size: 12
    history-days: 120
stockquant:
  shadow-research:
    scheduler:
      enabled: ${M4_SHADOW_SCHEDULER_ENABLED:false}
      cron: "0 20 17 * * MON-FRI"
      zone: Asia/Shanghai
      safe-window-start: "17:15"
      safe-window-end: "20:00"
      maximum-tushare-requests: 52
      maximum-model-calls: 13
      submit-timeout-seconds: 30
      monthly-tushare-request-limit: 150
      monthly-bailian-cost-limit-cny: 30.00
      project-monthly-api-cost-limit-cny: 200.00
  agent-team:
    enabled: ${AGENT_TEAM_ENABLED:false}
    base-url: ${AGENT_TEAM_BASE_URL:${quant.ai-service-url}}
    connect-timeout: 5s
    read-timeout: 60s
    executor:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 20
    shadow:
      enabled: ${AGENT_SHADOW_ENABLED:false}
      scheduler-enabled: ${AGENT_SHADOW_SCHEDULER_ENABLED:false}
      test-demo-pit-v2-enabled: ${AGENT_SHADOW_TEST_DEMO_PIT_V2_ENABLED:false}
      rule-version: 1.4.0-stage-2i-chief-decision-v1
      cron: "0 50 16 * * MON-FRI"
      zone: Asia/Shanghai
      safe-window-start: "16:40"
      safe-window-end: "18:30"
      max-symbols: 10
      max-concurrency: 2
      item-timeout: 5m
      poll-interval: 2s
  announcement:
    akshare:
      enabled: ${ANNOUNCEMENT_AKSHARE_ENABLED:false}
      base-url: ${ANNOUNCEMENT_AKSHARE_BASE_URL:${quant.ai-service-url}}
      connect-timeout: 5s
      # One logical request may contain 13 serialized 30-day AKShare chunks.
      read-timeout: 25m
  market-facts:
    v2:
      test-demo-enabled: false
    ifind:
      enabled: false
      activation-gate: BLOCKED
    tushare:
      mode: ${TUSHARE_MODE:DISABLED}
      base-url: https://api.tushare.pro
      token: ${TUSHARE_TOKEN:}
      official-rate-limit-per-minute: 200
      official-daily-limit-per-api: 100000
      application-safe-limit-per-minute: 180
      application-daily-safe-limit-per-api: 90000
      maximum-rate-limit-retries: 2
      connect-timeout: 5s
      read-timeout: 30s
      mainboard-read-timeout: 60s
      retry-backoff: 1s
logging:
  file:
    name: quant-server/target/stock-quant-production/logs/stock-quant-production.log
  level:
    com.stockquant: INFO
